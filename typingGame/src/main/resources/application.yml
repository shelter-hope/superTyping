# 应用服务配置
server:
  port: 8080
  servlet:
    context-path: /typingWord
  tomcat:
    max-threads: 200
    connection-timeout: 60000

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://47.114.110.103:3306/typing_word_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: typing_word_game
    password: 123456
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Redis配置
  data:
    redis:
      host: 47.114.110.103
      port: 6379
      password: 123456
      database: 0
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      key-serializer: org.springframework.data.redis.serializer.StringRedisSerializer
      value-serializer: org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer
  
  # WebSocket配置
  websocket:
    enabled: true
  
  # 安全配置
  security:
    cors:
      enabled: true
    csrf:
      enabled: false
  
  # 国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
  
  # 其他配置
  main:
    allow-circular-references: true

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.typinggame.controller

# 文件存储配置
file:
  upload-dir: ./uploads
  max-size: 10MB
  max-request-size: 10MB

# JWT配置
jwt:
  secret: H5FQLg1tDHnqxGXoNhAKDvSwQfkQLDa4W+I72dPruXE=
  expiration: 86400000
  refresh-expiration: 604800000

# AI 对话（方案 A：后端统一 chat 与存储）
# 配置后端调用第三方 LLM/工作流（例如 Coze workflow/run），不配置则返回占位文案
ai:
  llm:
    url: https://api.coze.cn/v1/workflow/run       # 例如 https://api.coze.cn/v1/workflow/run
    api-key: cztei_lksF2PzdPV7SaH8aNEJByRI7njNwsMQFglF34rR5inSDZRVGg6yjwrfk6zhbKNxGU   # 可选，Bearer 鉴权，例如 Coze 提供的 token
    workflow-id: 7593204689836998708 # 可选，第三方平台的 workflow_id（如 7593...）
  # 默认助手机器人 ID，对应 ai_conversation.ai_robot_id
  default-robot-id: 1
  default-conversation-title: "默认"

# 日志配置
logging:
  level:
    root: INFO
    com.typinggame: DEBUG
  file:
    name: ./logs/typing-game.log
    max-size: 10MB
    max-history: 7