spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.druid.initial-size=${DB_INITIAL_SIZE:10}
spring.datasource.druid.min-idle=${DB_MIN_IDLE:10}
spring.datasource.druid.max-active=${DB_MAX_ACTIVE:50}
spring.datasource.druid.max-wait=${DB_MAX_WAIT:60000}
