server:
  port: 8082
  servlet:
    context-path: /game-core-svc

spring:
  application:
    name: game-core-svc
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  config:
    import:
      - optional:classpath:config/config.properties
      - optional:classpath:config/jdbc.properties

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
