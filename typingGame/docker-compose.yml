version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - typing-game-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - typing-game-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    environment:
      - NAMESRV_ADDR=0.0.0.0:9876
    command: ["sh", "-c", "cd /opt/rocketmq-5.3.0 && sh bin/mqnamesrv"]
    networks:
      - typing-game-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - BROKER_NAME=broker-a
    command: ["sh", "-c", "cd /opt/rocketmq-5.3.0 && sh bin/mqbroker -n rocketmq-namesrv:9876"]
    depends_on:
      - rocketmq-namesrv
    networks:
      - typing-game-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - typing-game-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
       - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
       - MYSQL_DATABASE=${MYSQL_DATABASE:-typing_word_game}
       - MYSQL_USER=${MYSQL_USER:-typing_word_game}
       - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./DB/typing_word_game.sql:/docker-entrypoint-initdb.d/typing_word_game.sql
    networks:
      - typing-game-network

  # ---- 服务样板：其余 7 个服务按同样方式追加（P4 补齐） ----
  # 构建：docker build -f deploy/docker/Dockerfile --build-arg SERVICE=user-svc -t typing-game/user-svc:local .
  user-svc:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: user-svc
    image: typing-game/user-svc:local
    container_name: user-svc
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_URL=jdbc:mysql://mysql:3306/typing_word_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/user-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - typing-game-network

volumes:
  nacos-data:
  nacos-logs:
  redis-data:
  mysql-data:

networks:
  typing-game-network:
    driver: bridge
