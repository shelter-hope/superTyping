# typing-game 全栈编排（P4-3）
# 基础设施：nacos（注册中心）、redis、mysql（7 个空 schema，表由各服务 Flyway V1 建立）
# 业务服务：api-gateway + 7 个微服务，全部通过 deploy/docker/Dockerfile 统一构建
#
# 使用：
#   mvn -q -DskipTests -DskipITs package
#   docker compose up -d --build
#   ./deploy/smoke.ps1            # 或在 bash 下 bash deploy/smoke.sh
#
# 说明：
#   - 每个服务只连自己的 schema，见 spring.datasource.url；
#   - 迁移脚本在各自 src/main/resources/db/migration，服务启动时由 Flyway 执行；
#   - ddl-auto 固定 validate，表结构只允许通过迁移脚本变更；
#   - Nacos 关闭鉴权（本地/演示栈），生产请打开并给每个服务配置用户名密码。

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    nacos:
      condition: service_started
    redis:
      condition: service_healthy
  networks:
    - typing-game-network

x-service-env: &service-env
  NACOS_SERVER_ADDR: nacos:8848
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
  JWT_SECRET: ${JWT_SECRET:-H5FQLg1tDHnqxGXoNhAKDvSwQfkQLDa4W+I72dPruXE=}

services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - typing-game-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - typing-game-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动只建 7 个空 schema；表结构由各服务的 Flyway V1__init.sql 建立
      - ./DB/00-create-schemas.sql:/docker-entrypoint-initdb.d/00-create-schemas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - typing-game-network

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: api-gateway
    image: typing-game/api-gateway:local
    container_name: api-gateway
    environment:
      <<: *service-env
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  user-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: user-svc
    image: typing-game/user-svc:local
    container_name: user-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_user?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/user-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  game-core-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: game-core-svc
    image: typing-game/game-core-svc:local
    container_name: game-core-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/game-core-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  ai-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: ai-svc
    image: typing-game/ai-svc:local
    container_name: ai-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/ai-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  chat-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: chat-svc
    image: typing-game/chat-svc:local
    container_name: chat-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/chat-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  admin-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: admin-svc
    image: typing-game/admin-svc:local
    container_name: admin-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/admin-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  lab-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: lab-svc
    image: typing-game/lab-svc:local
    container_name: lab-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_lab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/lab-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  dict-svc:
    <<: *service-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: dict-svc
    image: typing-game/dict-svc:local
    container_name: dict-svc
    environment:
      <<: *service-env
      MYSQL_URL: jdbc:mysql://mysql:3306/typing_game_dict?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/dict-svc/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  nacos-data:
  nacos-logs:
  redis-data:
  mysql-data:

networks:
  typing-game-network:
    driver: bridge
