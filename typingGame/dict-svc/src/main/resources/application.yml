server:
  port: 8087
  servlet:
    context-path: /dict-svc

spring:
  application:
    name: dict-svc
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  config:
    import:
      - optional:classpath:config/config.properties
      - optional:classpath:config/jdbc.properties
