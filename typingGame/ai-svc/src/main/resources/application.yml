server:
  port: 8083
  servlet:
    context-path: /ai-svc

spring:
  application:
    name: ai-svc
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        ip: 127.0.0.1
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/typing_word_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 0

jwt:
  secret: ${JWT_SECRET:H5FQLg1tDHnqxGXoNhAKDvSwQfkQLDa4W+I72dPruXE=}

ai:
  llm:
    url: https://api.coze.cn/v1/workflow/run
    api-key: ${AI_LLM_API_KEY:cztei_lksF2PzdPV7SaH8aNEJByRI7njNwsMQFglF34rR5inSDZRVGg6yjwrfk6zhbKNxGU}
    workflow-id: 7593204689836998708
  default-robot-id: 1
  default-conversation-title: "默认"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.typinggame.ai: DEBUG
