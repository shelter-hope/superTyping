server:
  port: 8081
  servlet:
    context-path: /user-svc

spring:
  application:
    name: user-svc
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  config:
    import:
      - optional:classpath:config/config.properties
      - optional:classpath:config/jdbc.properties

user:
  bootstrap:
    game-core-base-url: http://game-core-svc/game-core-svc
