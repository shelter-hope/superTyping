# 应用服务配置
server:
  port: 8080
  servlet:
    context-path: /typingWord
  tomcat:
    max-threads: 200
    connection-timeout: 60000

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/typing_word_game?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Redis配置（优化连接池和超时参数）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 10000ms
      connect-timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 10000ms
  
  # Redisson配置（分布式锁/缓存）
  redisson:
    config: |
      singleServerConfig:
        address: redis://${spring.data.redis.host}:${spring.data.redis.port}
        password: ${spring.data.redis.password}
        database: ${spring.data.redis.database}
        connectionPoolSize: 20
        connectionMinimumIdleSize: 5
        idleConnectionTimeout: 10000
        connectTimeout: 5000
        timeout: 3000
  
  # WebSocket配置
  websocket:
    enabled: true
  
  # 安全配置
  security:
    cors:
      enabled: true
    csrf:
      enabled: false
  
  # 国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
  
  # 其他配置
  main:
    allow-circular-references: true

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.typinggame.controller

# 文件存储配置
