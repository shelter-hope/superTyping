spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # dev 必须显式提供允许的来源，避免误用本地默认值上线
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN}
