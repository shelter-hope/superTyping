spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.ip=${NACOS_IP:}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
typing.gateway.ip-per-second=${GATEWAY_IP_PER_SECOND:30}
typing.gateway.user-per-second=${GATEWAY_USER_PER_SECOND:20}
logging.level.org.springframework.cloud.gateway=${LOG_LEVEL:INFO}
logging.level.org.springframework.web.reactive=${LOG_LEVEL:INFO}
